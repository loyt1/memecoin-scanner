name: scan
on:
  schedule:
    - cron: "7 * * * *"   # relance de secours toutes les heures
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Relevés en continu (toutes les 15 min pendant 5 h 40)
        run: bash boucle.sh
